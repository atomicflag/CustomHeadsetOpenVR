<!-- Local Dimming Section -->
@if(settings && defaults && settings.localDimming && defaults.localDimming) {
  <div class="field">
    <app-field-note type="steamvrRestart" />
    <div class="title">
      <span i18n>Enable Local Dimming</span>
      <app-field-tip i18n-info info="Enables or disables sending the zone frames to the headset." />
      <app-reset-button [canReset]="settings.localDimming.enable !== defaults.localDimming.enable"
          (resetClick)="nested('localDimming').resetOption('enable')"></app-reset-button>
    </div>
    <div class="control">
      <mat-slide-toggle [(ngModel)]="settings.localDimming.enable" (ngModelChange)="saveConfigSettings()"></mat-slide-toggle>
    </div>
  </div>
}
